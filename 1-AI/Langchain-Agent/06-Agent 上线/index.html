<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>LangChain Agent</title>
  <style>
    body { max-width: 700px; margin: 40px auto; font-family: sans-serif; }
    #output { white-space: pre-wrap; background: #f5f5f5; padding: 16px; min-height: 100px; border-radius: 8px; }
    #input { width: 80%; padding: 8px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>LangChain Agent</h2>
  <input id="input" placeholder="输入你的问题..." />
  <button onclick="send()">发送</button>
  <pre id="output"></pre>

  <script>
    async function send() {
      const query = document.getElementById("input").value;
      const output = document.getElementById("output");
      output.textContent = "";
      const resp = await fetch("http://localhost:8000/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // 演示用固定值；生产环境建议用 crypto.randomUUID() 生成并存入 localStorage
        body: JSON.stringify({ query, session_id: "web_user" }), 
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (line.startsWith("data: ")) {
            const data = line.slice(6);
            if (data === "[DONE]") return;
            try {
              const payload = JSON.parse(data);
              //逐字追加
              output.textContent += payload.content; 
            } catch (e) {
              // 兼容非 JSON 数据
              output.textContent += data;
            }
          }
        }
      }
    }
  </script>
</body>
</html>
