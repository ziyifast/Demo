<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f2f4f7;
         height: 100vh; display: flex; justify-content: center; align-items: center; }
  .shell { width: 100%; max-width: 780px; height: 92vh; background: #fff;
           display: flex; flex-direction: column; border-radius: 16px; overflow: hidden;
           box-shadow: 0 0 24px rgba(0,0,0,.06); }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
         background: #1a56db; color: #fff; }
  .top .name { font-weight: 600; font-size: 14px; }
  .top .spacer { flex: 1; }
  .top button { background: rgba(255,255,255,.15); border: none; color: #fff;
                padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex;
          flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 8px; max-width: 85%; }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .row.ai { align-self: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px;
            line-height: 1.6; white-space: pre-wrap; }
  .row.user .bubble { background: #1a56db; color: #fff; }
  .row.ai .bubble { background: #f3f4f6; color: #1f2937; }
  .typing span { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
                 background: #9ca3af; margin: 0 2px; animation: b 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%,80%,100%{opacity:.3} 40%{opacity:1} }
  .ticket { align-self: flex-start; background: #ecfdf5; border: 1px solid #6ee7b7;
            border-radius: 12px; padding: 14px; font-size: 13px; max-width: 85%; }
  .ticket .tid { font-family: monospace; background: #fff;
                 padding: 2px 8px; border-radius: 4px; }
  .composer { display: flex; gap: 8px; padding: 14px 20px;
              border-top: 1px solid #e5e7eb; }
  .composer input { flex: 1; padding: 11px 16px; border: 1px solid #d1d5db;
                    border-radius: 24px; font-size: 14px; outline: none; }
  .composer button { width: 44px; height: 44px; border-radius: 50%; border: none;
                     background: #1a56db; color: #fff; cursor: pointer; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px;
           justify-content: center; padding: 20px; }
  .quick button { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe;
                  padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="name" id="title">🛎️ 智能客服</div>
    <div class="spacer"></div>
    <button onclick="reset()">新会话</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="composer">
    <input id="input" placeholder="请输入您的问题…" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">➤</button>
  </div>
</div>
<script>
// ============ 身份初始化（URL 参数优先） ============
const _p = new URLSearchParams(location.search);

let userId = _p.get('user')
  || localStorage.getItem('cs_user')
  || 'user-' + Math.random().toString(36).slice(2, 6);
localStorage.setItem('cs_user', userId);          // 跨标签页共享用户身份

let sid = _p.get('session')
  || sessionStorage.getItem('cs_sid')
  || 's-' + Math.random().toString(36).slice(2, 10);
sessionStorage.setItem('cs_sid', sid);

const $title = document.getElementById('title');
function refreshTitle() {
  $title.textContent = `🛎️ 智能客服 · ${userId} / ${sid}`;
}
refreshTitle();

// ============ 对话逻辑 ============
const $m = document.getElementById('msgs'), $i = document.getElementById('input');
let busy = false, cur = null;

function scroll() { $m.scrollTop = $m.scrollHeight; }

function addUser(t) {
  const r = document.createElement('div'); r.className = 'row user';
  r.innerHTML = `<div class="bubble">${t}</div>`;
  $m.appendChild(r); scroll();
}

function addAI() {
  const r = document.createElement('div'); r.className = 'row ai';
  const b = document.createElement('div'); b.className = 'bubble';
  b.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  r.appendChild(b); $m.appendChild(r); scroll(); cur = b;
}

function token(t) {
  if (!cur) return;
  const ty = cur.querySelector('.typing'); if (ty) cur.textContent = '';
  cur.textContent += t; scroll();
}

function done(t) {
  if (!cur) return;
  if (cur.querySelector('.typing')) cur.textContent = t || '（无回复）';
  cur = null;
}

function ticket(ev) {
  if (cur) { cur.parentElement.remove(); cur = null; }
  const d = document.createElement('div'); d.className = 'ticket';
  d.innerHTML = `<b>✅ 退款申请已提交</b><br>工单号
    <span class="tid">${ev.ticket_id}</span><br>
    <span style="color:#6b7280;font-size:12px">${ev.message}</span>`;
  $m.appendChild(d); scroll();
}

async function stream(url, body, cb) {
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done: d, value } = await reader.read(); if (d) break;
    buf += dec.decode(value, { stream: true });
    const frames = buf.split('\n\n'); buf = frames.pop();
    for (const f of frames) if (f.startsWith('data: ')) cb(JSON.parse(f.slice(6)));
  }
}

async function send() {
  const t = $i.value.trim(); if (!t || busy) return;
  $i.value = ''; addUser(t); busy = true;
  await stream('/api/chat/stream',
    { user_id: userId, session_id: sid, message: t },
    ev => {
      if (ev.type === 'start') addAI();
      else if (ev.type === 'token') token(ev.content);
      else if (ev.type === 'ticket_created') ticket(ev);
      else if (ev.type === 'done') done(ev.answer);
      else if (ev.type === 'error') { done(''); alert(ev.message); }
    });
  busy = false;
}

function reset() {
  if (busy) return;
  // 只换会话，不换用户
  sid = 's-' + Math.random().toString(36).slice(2, 10);
  sessionStorage.setItem('cs_sid', sid);
  refreshTitle();
  $m.innerHTML = '';
  welcome();
}

function welcome() {
  const w = document.createElement('div'); w.className = 'quick';
  w.innerHTML = `
    <button onclick="$i.value='帮我查订单 1001';send()">查询订单</button>
    <button onclick="$i.value='七天无理由怎么算';send()">七天无理由</button>
    <button onclick="$i.value='退款多久到账';send()">退款时效</button>
    <button onclick="$i.value='我要申请退款，订单 1003';send()">申请退款</button>`;
  $m.appendChild(w);
}

welcome();
</script>
</body>
</html>
