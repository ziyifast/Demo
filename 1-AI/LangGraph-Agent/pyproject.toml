[project]
name = "langgraph-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ysonzhou", email = "ysonzhou@tencent.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
    "langchain-openai>=1.7.2",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "markdownify>=1.2.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
langgraph-agent = "langgraph_agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
